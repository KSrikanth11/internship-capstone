name: Weekly checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Progress (all weeks, informational)
        run: python scripts/progress.py

      - name: This week's tests (branch week-NN-...)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$BRANCH" =~ ^week-0?([1-8])([^0-9]|$) ]]; then
            python -m pytest -v "$(ls -d week0${BASH_REMATCH[1]}_*)"
          else
            echo "Branch '$BRANCH' is not named week-NN-..., so no week is enforced."
          fi
